# A release is a tag vX.Y.Z, made by push-release.sh. This workflow then
#   1. checks that the tag is the version in probe/profile.go, and runs the tests,
#   2. builds the container images for amd64 and arm64 and pushes them to ghcr.io/nashcom/eas-tools,
#   3. makes the GitHub release with the section of CHANGES.md as its text.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: The tag has to be the version of the program
        id: version
        run: |
          VERSION=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' probe/profile.go)
          if [ -z "$VERSION" ] || [ "v$VERSION" != "$GITHUB_REF_NAME" ]
          then
            echo "::error::The tag is $GITHUB_REF_NAME, but probe/profile.go has the version '$VERSION'"
            exit 1
          fi
          if ! grep -q "^## $VERSION\$" CHANGES.md
          then
            echo "::error::CHANGES.md has no section '## $VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

  images:
    name: Image ${{ matrix.name }} (amd64 and arm64)
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # to push the image to GHCR

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            file: container/dockerfile
            suffix: ""
            moving: latest
          - name: wolfi
            file: container/dockerfile_wolfi
            suffix: "-wolfi"
            moving: wolfi
          - name: static
            file: container/dockerfile_static
            suffix: "-static"
            moving: static

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-platform build: the manifest list makes "docker pull ghcr.io/nashcom/eas-tools" pick the right architecture. The Go programs are
      # cross-compiled on the runner (see the Dockerfiles), so arm64 needs no emulated compiler. The source label ties the package to this repository.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nashcom/eas-tools:${{ needs.check.outputs.version }}${{ matrix.suffix }}
            ghcr.io/nashcom/eas-tools:${{ matrix.moving }}
          labels: |
            org.opencontainers.image.title=eas-tools
            org.opencontainers.image.description=ActiveSync toolbox for HCL Traveler: blackbox exporter, load worker, EAS client
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub release
    needs: [check, images]
    runs-on: ubuntu-latest

    permissions:
      contents: write  # to create the release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The text of the release is the section of CHANGES.md of this version, without its heading line, and how to get the images
      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '/^## / { show = ($0 == heading) } show' CHANGES.md | sed '1d' > notes.md
          {
            echo
            echo "Images for amd64 and arm64:"
            echo
            echo '```'
            echo "docker pull ghcr.io/nashcom/eas-tools:$VERSION"
            echo "docker pull ghcr.io/nashcom/eas-tools:$VERSION-wolfi"
            echo "docker pull ghcr.io/nashcom/eas-tools:$VERSION-static"
            echo '```'
          } >> notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
