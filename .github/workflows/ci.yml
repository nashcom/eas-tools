name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]
          then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

  image:
    name: Container image (amd64 and arm64, not pushed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Dockerfiles cross-compile the Go programs on the amd64 runner (no emulation for the compiler); QEMU is only needed for the few
      # RUN steps of the runtime stage of the Alpine and Wolfi images when they are made for arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A build that is not pushed: it proves that the image can be made for both platforms. The release workflow pushes them.
      - name: Build the image for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,mode=max,scope=alpine
